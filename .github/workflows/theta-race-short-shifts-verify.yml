name: Replay reviewed short-shifts revisions

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /
      - name: Fetch the three reviewed revisions and pinned dependencies
        id: ready
        run: bash .github/scripts/replay-reviewed-short-shifts.sh prepare
      - name: Verify PR 16 with an empty upstream build cache
        run: bash .github/scripts/replay-reviewed-short-shifts.sh 16
      - name: Verify PR 43
        run: bash .github/scripts/replay-reviewed-short-shifts.sh 43
        if: ${{ !cancelled() && steps.ready.outcome == 'success' }}
      - name: Verify PR 45
        run: bash .github/scripts/replay-reviewed-short-shifts.sh 45
        if: ${{ !cancelled() && steps.ready.outcome == 'success' }}
