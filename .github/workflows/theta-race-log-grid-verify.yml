name: Verify theta-race-log-grid

on:
  push:
    branches: [main]
    paths: ['results/theta-race-log-grid/**']
  pull_request:
    paths: ['results/theta-race-log-grid/**']
  workflow_dispatch:

defaults:
  run:
    working-directory: results/theta-race-log-grid

permissions:
  contents: read

concurrency:
  group: verify-theta-race-log-grid-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify-release.sh
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The pinned toolchain, Mathlib cache and build land on the root disk,
      # so clear preinstalled SDKs first.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /
      - name: Install the pinned arithmetic package
        run: |
          python3 -m venv "$RUNNER_TEMP/venv"
          if [ -f requirements.txt ]; then "$RUNNER_TEMP/venv/bin/python" -m pip install -r requirements.txt; fi
          echo "$RUNNER_TEMP/venv/bin" >> "$GITHUB_PATH"
      - name: Certificates, Lean rebuild, replay and audit
        run: bash verify-release.sh
