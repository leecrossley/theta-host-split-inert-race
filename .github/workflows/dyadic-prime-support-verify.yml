name: Verify dyadic prime support

on:
  push:
    branches: [main]
    paths: ['results/dyadic-prime-support/**', '.github/workflows/dyadic-prime-support-verify.yml']
  pull_request:
    paths: ['results/dyadic-prime-support/**', '.github/workflows/dyadic-prime-support-verify.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dyadic-prime-support-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Free space for Lean and Mathlib
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
      - name: Check the prime certificates and nine Lean lemmas
        run: bash results/dyadic-prime-support/verify-release.sh
